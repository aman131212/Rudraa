name: Build Rudraa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rudraa-APK
          path: bin/*.apk
          if-no-files-found: error
